<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fasto World | جاري التوجيه...</title>

  <meta property="og:title" content="Fasto World — Smart Redirect">
  <meta property="og:description" content="المنصة العربية الأولى للأنيميشن الطبي ثلاثي الأبعاد 3D Medical Animation">
  <meta property="og:image" content="https://www.fastoworld.com/content/fasto.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <link rel="icon" type="image/png" href="https://www.fastoworld.com/content/fasto.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b090e;
      --card: rgba(22, 17, 28, 0.85);
      --purple: #a855f7;
      --pink: #ee3b7c;
      --glow: rgba(168, 85, 247, 0.4);
      --text: #f7f2f4;
      --muted: #a396a0;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 50% 15%, rgba(168, 85, 247, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 50% 85%, rgba(238, 59, 124, 0.14) 0%, transparent 55%);
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px var(--glow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      position: relative;
      z-index: 2;
    }

    /* Logo Avatar */
    .avatar-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
      animation: pulse 2.2s infinite ease-in-out;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #15101a;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(168, 85, 247, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(238, 59, 124, 0.7); }
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 40%, var(--purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.status {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Spinner */
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 24px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Action Button */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%);
      color: #fff;
      font-size: 1.12rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(238, 59, 124, 0.4);
      transition: transform 0.25s, box-shadow 0.25s;
      border: none;
      cursor: pointer;
    }
    .btn-action:hover, .btn-action:active {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(238, 59, 124, 0.6);
    }

    /* iOS In-App Helper Card */
    #iosCard {
      display: none;
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px;
      text-align: right;
    }
    .ios-step {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .ios-step:last-child { margin-bottom: 0; }
    .step-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.25);
      color: #e9d5ff;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* Top-Right Arrow Indicator for iOS */
    .top-arrow {
      display: none;
      position: fixed;
      top: 14px;
      left: 18px; /* RTL top right */
      z-index: 999;
      animation: bounce 1.4s infinite ease-in-out;
      color: #fbbf24;
      font-size: 1.8rem;
    }
    html[dir="rtl"] .top-arrow { left: auto; right: 18px; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    footer {
      margin-top: 24px;
      font-size: 0.82rem;
      color: #645a63;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-arrow" id="topArrow">↗️</div>

  <div class="container">
    <div class="avatar-wrap">
      <img src="https://www.fastoworld.com/content/fasto.png" alt="Fasto World Logo" onerror="this.src='https://fastorochi.github.io/go/fasto.png'">
    </div>

    <h1>Fasto World</h1>
    <p class="status" id="statusText">جاري التوجيه إلى الرابط المطلوب...</p>

    <div class="spinner" id="spinner"></div>

    <a id="actionBtn" href="https://www.fastoworld.com" class="btn-action">
      <span>فتح الرابط الآن</span>
      <span dir="ltr">↗</span>
    </a>

    <!-- إرشاد مستخدمي آيفون داخل إنستجرام وتيك توك -->
    <div id="iosCard">
      <div style="color:#fbbf24;font-weight:800;font-size:0.95rem;margin-bottom:12px;display:flex;align-items:center;gap:6px">
        <span>💡</span>
        <span>لأفضل تجربة وسرعة على آيفون:</span>
      </div>
      <div class="ios-step">
        <span class="step-badge">1</span>
        <span>اضغط على النقاط الثلاث <strong>( ••• )</strong> في الزاوية العلوية.</span>
      </div>
      <div class="ios-step">
        <span class="step-badge">2</span>
        <span>اختر <strong>"Open in Safari"</strong> أو <strong>"فتح في المتصفح"</strong>.</span>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 Fasto World — Smart Deep Link System
  </footer>

  <script>
    (function () {
      // 1. خريطة الوجهات الذكية (Dynamic Destinations Map)
      var DESTINATIONS = {
        default: "https://www.fastoworld.com",
        book: "https://whop.com/fastoworld/8-4-25/",
        guide: "https://whop.com/fastoworld/8-4-25/",
        yt: "https://www.youtube.com/@Fasto_World",
        youtube: "https://www.youtube.com/@Fasto_World",
        ig: "https://www.instagram.com/fasto_world",
        instagram: "https://www.instagram.com/fasto_world",
        fb: "https://www.facebook.com/fasto.world",
        facebook: "https://www.facebook.com/fasto.world",
        tt: "https://www.tiktok.com/@FASTO.WORLD",
        tiktok: "https://www.tiktok.com/@FASTO.WORLD",
        wa: "https://wa.me/212779094448",
        whatsapp: "https://wa.me/212779094448"
      };

      // 2. قراءة بارامترات الرابط ?to=... أو ?url=...
      var params = new URLSearchParams(window.location.search);
      var toKey = (params.get("to") || "").toLowerCase().trim();
      var customUrl = params.get("url");

      var target = DESTINATIONS[toKey] || customUrl || DESTINATIONS.default;

      // 3. كشف مصدر الزيارة للسوشيال ميديا وإضافة UTM Tracking
      var ua = navigator.userAgent || "";
      var isInstagram = /Instagram/i.test(ua);
      var isFacebook = /FBAN|FBAV/i.test(ua);
      var isTikTok = /BytedanceWebview|TikTok/i.test(ua);
      var isSnapchat = /Snapchat/i.test(ua);
      var isTwitter = /Twitter|X-App/i.test(ua);
      var isLinkedIn = /LinkedInApp/i.test(ua);
      var isInApp = isInstagram || isFacebook || isTikTok || isSnapchat || isTwitter || isLinkedIn;

      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);

      // إضافة وسوم التتبع الذكية UTM إذا كان الرابط يخص Fasto World
      if (target.indexOf("fastoworld.com") !== -1) {
        var source = isInstagram ? "instagram" : (isTikTok ? "tiktok" : (isFacebook ? "facebook" : (isSnapchat ? "snapchat" : "social_bio")));
        var sep = target.indexOf("?") === -1 ? "?" : "&";
        target += sep + "utm_source=" + source + "&utm_medium=smart_redirect";
      }

      // تحديث زر الانتقال ورابط الصفحة
      var actionBtn = document.getElementById("actionBtn");
      var spinner = document.getElementById("spinner");
      var statusText = document.getElementById("statusText");
      var iosCard = document.getElementById("iosCard");
      var topArrow = document.getElementById("topArrow");

      if (actionBtn) actionBtn.href = target;

      // 4. التوجيه الذكي:
      // حالة أ: متصفح عادي خارجي (حاسوب، كروم، سفاري عادي) -> توجيه فوري
      if (!isInApp) {
        window.location.replace(target);
        return;
      }

      // حالة ب: أندرويد داخل تطبيق (إنستجرام، تيك توك، إلخ) -> كسر الحصار وفتح Chrome تلقائياً
      if (isAndroid) {
        statusText.textContent = "جاري فتح الرابط في Google Chrome...";
        var cleanTarget = target.replace(/^https?:\/\//i, "");
        var chromeIntent = "intent://" + cleanTarget + "#Intent;scheme=https;package=com.android.chrome;end";

        window.location.href = chromeIntent;

        setTimeout(function () {
          if (!document.hidden) {
            spinner.style.display = "none";
            statusText.textContent = "إذا لم يفتح المتصفح تلقائياً، اضغط الزر أدناه:";
          }
        }, 2200);
        return;
      }

      // حالة ج: آيفون داخل تطبيق (iOS WebViews) -> إيقاف السبنر وعرض تعليمات فتح Safari
      if (isIOS) {
        spinner.style.display = "none";
        statusText.textContent = "اضغط على الزر أدناه أو افتحه في Safari:";
        if (iosCard) iosCard.style.display = "block";
        if (topArrow) topArrow.style.display = "block";
        return;
      }

      // الحالات الأخرى
      spinner.style.display = "none";
    })();
  </script>
</body>
</html>
